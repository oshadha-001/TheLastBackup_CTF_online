[project]
name = "the-last-backup-vercel"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.2",
  "SQLAlchemy==2.0.44",
  "psycopg[binary]==3.2.10",
  "Pillow==11.3.0",
  "python-dotenv==1.1.1",
  "waitress==3.0.2",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
